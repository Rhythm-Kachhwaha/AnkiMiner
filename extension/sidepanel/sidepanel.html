<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AnkiMiner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <main class="panel">
    <header class="panel-header">
      <div class="brand">
        <span class="eyebrow">ANKIMINER</span>
      </div>
      <div class="connection-indicators" role="status" aria-label="Service connection status">
        <span id="indicator-yomitan" class="indicator-pill" title="Yomitan: Ready" aria-label="Yomitan status">
          <span class="indicator-dot"></span>
          <span class="indicator-label">Yomitan</span>
        </span>
        <span id="indicator-anki" class="indicator-pill" title="Anki: Checking…" aria-label="Anki status">
          <span class="indicator-dot"></span>
          <span class="indicator-label">Anki</span>
        </span>
      </div>
    </header>

    <!-- Mining Mode Navigation Tabs -->
    <nav class="mining-nav-tabs" role="tablist" aria-label="Mining Mode">
      <button type="button" id="tab-btn-text" class="tab-btn active" role="tab" aria-selected="true" aria-controls="text-mining-view">
        Text Mining
      </button>
      <button type="button" id="tab-btn-video" class="tab-btn" role="tab" aria-selected="false" aria-controls="video-mining-view">
        Video Mining
      </button>
    </nav>

    <!-- Text Mining View -->
    <div id="text-mining-view" class="mining-tab-view" role="tabpanel" aria-labelledby="tab-btn-text">
      <div class="mining-bar">
        <div class="mining-controls">
          <button id="mining-toggle" type="button" aria-pressed="false" class="btn-mining">Start mining</button>
          <p id="mode" class="status-mode">Mining mode is off.</p>
        </div>
        <span id="session-count" class="session-counter">Cards this session: 0</span>
      </div>

      <div class="capture-banner">
        <p id="capture-status" class="status">Select Japanese text after starting mining.</p>
        <span id="save-badge" class="badge" hidden></span>
      </div>
    </div>

    <!-- Video Mining View -->
    <div id="video-mining-view" class="mining-tab-view" role="tabpanel" aria-labelledby="tab-btn-video" hidden>
      <section id="video-mining-section" class="video-mining-panel" aria-label="Video Mining Controls">
        <div class="video-toolbar">
          <div class="video-action-buttons">
            <button type="button" id="load-subtitles-btn" class="btn-subtitles">Load Subtitles (.srt, .vtt)</button>
            <button type="button" id="clear-subtitles-btn" class="btn-clear-subtitles" title="Clear loaded subtitles">Clear</button>
            <input type="file" id="subtitles-file-input" accept=".srt,.vtt" hidden>
          </div>
          <span id="subtitles-file-status" class="subtitles-status-pill">No subtitles</span>
        </div>

        <div class="video-controls-row">
          <select id="video-track-select" class="video-track-select" hidden aria-label="Select subtitle track">
            <option value="">Default track</option>
          </select>

          <div class="video-offset-controls">
            <span class="offset-label">Offset:</span>
            <div class="offset-btn-group">
              <button type="button" id="offset-minus-btn" class="btn-offset" title="Subtract 0.5s">-0.5s</button>
              <button type="button" id="offset-reset-btn" class="btn-offset btn-offset-reset" title="Reset offset to 0.0s">
                <span id="offset-display">0.0s</span>
              </button>
              <button type="button" id="offset-plus-btn" class="btn-offset" title="Add 0.5s">+0.5s</button>
            </div>
          </div>
        </div>

        <div class="video-cue-preview-container">
          <div class="cue-preview-label">Active Subtitle:</div>
          <div id="video-current-cue-preview" class="video-cue-preview">—</div>
        </div>
      </section>
    </div>

    <!-- Prominent Captured Japanese Word Display -->
    <section id="captured-word-section" class="captured-word-hero" aria-label="Captured Japanese Word">
      <div class="word-display-card">
        <h1 id="expression" class="hero-expression">—</h1>
        <p id="reading" class="hero-reading"></p>
      </div>
    </section>

    <!-- Dictionary Information Section -->
    <section id="dictionary-section" class="dictionary-section" aria-live="polite">
      <div class="section-header">
        <span class="section-title">DICTIONARY</span>
      </div>
      <div id="meanings" class="details"></div>
      <div id="examples" class="details"></div>
    </section>

    <!-- Card Editor Form -->
    <section id="card-editor-section" class="card-editor-section">
      <div class="section-header">
        <span class="section-title">CARD</span>
      </div>
      <form id="card-editor" class="card-editor" hidden>
        <input type="hidden" id="field-card-id" name="id">
        <input type="hidden" id="field-deck-name" name="deck_name" value="Default">
        <input type="hidden" id="field-model-name" name="model_name" value="">
        <input type="hidden" id="field-source-text" name="source_text">
        <input type="hidden" id="field-deinflected-text" name="deinflected_text">

        <div class="form-group">
          <label for="field-expression">Expression</label>
          <input type="text" id="field-expression" name="expression" required autocomplete="off" class="japanese-input">
        </div>

        <div class="form-group">
          <label for="field-reading">Reading</label>
          <input type="text" id="field-reading" name="reading" autocomplete="off" class="japanese-input">
        </div>

        <div class="form-group">
          <label for="field-meaning">Meaning</label>
          <textarea id="field-meaning" name="meaning" rows="2"></textarea>
        </div>

        <div class="form-row-compact">
          <div class="form-group deck-selector-group">
            <label for="field-deck-select">Deck</label>
            <select id="field-deck-select" name="deck_select">
              <option value="Default">Default</option>
            </select>
          </div>

          <div class="form-group model-selector-group">
            <label for="field-model-select">Note Type</label>
            <select id="field-model-select" name="model_select">
              <option value="Basic">Basic</option>
            </select>
          </div>
        </div>

        <div class="form-group font-selector-group">
          <label for="field-font-select">Font</label>
          <select id="field-font-select" name="font_select">
            <option value="Noto Sans JP">Noto Sans Japanese</option>
            <option value="Noto Serif JP">Noto Serif Japanese</option>
            <option value="system-ui">System Default</option>
          </select>
        </div>

        <div class="optional-toggle-container">
          <button type="button" id="toggle-optional" class="btn-toggle-optional" aria-expanded="false">
            + Optional fields
          </button>
        </div>

        <div id="optional-fields" class="optional-fields" hidden>
          <div class="form-group">
            <label for="field-hint">Hint</label>
            <input type="text" id="field-hint" name="hint" autocomplete="off">
          </div>
          <div class="form-group">
            <label for="field-example-sentence">Example sentence</label>
            <textarea id="field-example-sentence" name="example_sentence" rows="2" class="japanese-input"></textarea>
          </div>
          <div class="form-group">
            <label for="field-example-translation">Example translation</label>
            <textarea id="field-example-translation" name="example_translation" rows="2"></textarea>
          </div>
          <div class="form-group">
            <label for="field-image">Image</label>
            <input type="text" id="field-image" name="image" placeholder="URL or path" autocomplete="off">
          </div>
          <div class="form-group">
            <label for="field-audio">Audio</label>
            <input type="text" id="field-audio" name="audio" placeholder="URL or path" autocomplete="off">
          </div>
          <div class="form-group">
            <label for="field-tags">Tags</label>
            <input type="text" id="field-tags" name="tags" placeholder="e.g. n5, verbs" autocomplete="off">
          </div>
          <div class="form-group">
            <label for="field-notes">Notes</label>
            <textarea id="field-notes" name="notes" rows="2"></textarea>
          </div>
        </div>

        <div class="editor-actions">
          <button type="submit" id="save-card-btn" class="btn-save">Save Card</button>
          <div class="sync-actions">
            <button type="button" id="sync-anki-btn" class="btn-sync" disabled>Send to Anki</button>
            <span id="anki-sync-status" class="sync-status-label">Anki: Not connected</span>
          </div>
        </div>
      </form>
    </section>

    <!-- Mining History & Card Library -->
    <section id="history-section" class="history-section" aria-label="Mining History & Card Library">
      <div class="section-header history-header">
        <span class="section-title">HISTORY</span>
        <span id="history-count" class="history-count">0 cards</span>
      </div>

      <div class="history-toolbar">
        <div class="history-search-group">
          <input
            type="search"
            id="history-search-input"
            class="history-search-input"
            placeholder="Search cards…"
            autocomplete="off"
            aria-label="Search cards"
          >
        </div>
        <div class="history-filter-row">
          <select id="history-deck-filter" class="history-filter-select" aria-label="Filter by deck">
            <option value="all">All decks</option>
          </select>
          <select id="history-sync-filter" class="history-filter-select" aria-label="Filter by sync status">
            <option value="all">All statuses</option>
            <option value="pending">Pending</option>
            <option value="syncing">Syncing</option>
            <option value="synced">Synced</option>
            <option value="failed">Failed</option>
          </select>
        </div>
      </div>

      <div id="history-list-container" class="history-list-container" role="region" aria-label="Saved cards list">
        <div id="history-empty" class="history-empty" hidden>No saved cards.</div>
        <div id="history-cards-list" class="history-cards-list"></div>
      </div>
    </section>
  </main>
  <script src="../lib/subtitle-parser.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
